name: Manual Force Upgrade Dependencies

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which workspace to upgrade?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - backend
      force_audit_fix:
        description: 'Force audit fix (includes breaking major updates)?'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write # Needed to trigger downstream CI workflows

concurrency:
  group: force-upgrade-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  force-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Log Workflow Execution Parameters
        run: |
          echo "===================================================="
          echo "🏁 Starting Manual Audit Fix Workflow"
          echo "🎯 Target Workspace: ${{ inputs.target }}"
          echo "🛡️ Force Audit Fix Enabled: ${{ inputs.force_audit_fix }}"
          echo "===================================================="

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Log Environment Information
        run: |
          echo "ℹ️ Node Version: $(node -v)"
          echo "ℹ️ NPM Version:  $(npm -v)"

      # ----------------------------------------------------
      # Frontend Audit Fix Step
      # ----------------------------------------------------
      - name: Force Audit Fix Frontend Dependencies
        if: ${{ inputs.target == 'all' || inputs.target == 'frontend' }}
        run: |
          echo "===================================================="
          echo "🚀 [Frontend] Starting audit fix process..."
          echo "===================================================="
          
          echo "📊 [Frontend] Initial vulnerability audit report:"
          npm audit || true
          
          echo "🩹 [Frontend] Running standard npm audit fix (safe fixes first)..."
          npm audit fix || echo "⚠️ [Frontend] Standard npm audit fix returned warnings (continuing)..."
          
          if [ "${{ inputs.force_audit_fix }}" = "true" ]; then
            echo "🩹 [Frontend] Force audit fix enabled. Running npm audit fix --force for remaining issues..."
            npm audit fix --force || echo "⚠️ [Frontend] npm audit fix --force returned warnings (continuing)..."
          fi
          
          echo "📊 [Frontend] Post-fix vulnerability audit report:"
          npm audit || true
          
          echo "🏗️ [Frontend] Running verification build (npm run build)..."
          npm run build
          echo "✅ [Frontend] Build finished successfully."
        working-directory: Frontend

      # ----------------------------------------------------
      # Backend Audit Fix Step
      # ----------------------------------------------------
      - name: Force Audit Fix Backend Dependencies
        if: ${{ inputs.target == 'all' || inputs.target == 'backend' }}
        run: |
          echo "===================================================="
          echo "🚀 [Backend] Starting audit fix process..."
          echo "===================================================="
          
          echo "📊 [Backend] Initial vulnerability audit report:"
          npm audit || true
          
          echo "🩹 [Backend] Running standard npm audit fix (safe fixes first)..."
          npm audit fix || echo "⚠️ [Backend] Standard npm audit fix returned warnings (continuing)..."
          
          if [ "${{ inputs.force_audit_fix }}" = "true" ]; then
            echo "🩹 [Backend] Force audit fix enabled. Running npm audit fix --force for remaining issues..."
            npm audit fix --force || echo "⚠️ [Backend] npm audit fix --force returned warnings (continuing)..."
          fi
          
          echo "📊 [Backend] Post-fix vulnerability audit report:"
          npm audit || true
          
          echo "🔍 [Backend] Verifying server entrypoint syntax (node --check server.js)..."
          node --check server.js
          echo "✅ [Backend] Entrypoint check finished successfully."
        working-directory: Backend

      # ----------------------------------------------------
      # Commit & Push Changes, Then Trigger Target CIs
      # ----------------------------------------------------
      - name: Commit, Push & Trigger Target CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===================================================="
          echo "⚙️ [Git] Configuring Git bot identity..."
          echo "===================================================="
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          echo "📂 [Git] Staging package files..."
          git add Frontend/package.json Frontend/package-lock.json Backend/package.json Backend/package-lock.json 2>/dev/null || true
          
          echo "🔍 [Git] Checking for staged changes..."
          if ! git diff --cached --quiet; then
            echo "✏️ [Git] Changes detected! Creating commit..."
            git commit -m "chore(deps): manual force audit fix dependencies"
            
            echo "🔄 [Git] Pulling latest changes from main with rebase..."
            git pull --rebase origin main
            
            echo "🚀 [Git] Pushing commit to main..."
            git push origin main
            echo "✅ [Git] Successfully pushed updated dependencies to main."
            
            # Explicitly trigger downstream CI workflows so deployment happens automatically
            if [ "${{ inputs.target }}" = "all" ] || [ "${{ inputs.target }}" = "frontend" ]; then
              echo "🔄 [Dispatch] Triggering Frontend CI workflow (frontend-ci.yml)..."
              gh workflow run frontend-ci.yml --ref main || echo "⚠️ [Dispatch] Failed to trigger Frontend CI workflow."
            fi
            
            if [ "${{ inputs.target }}" = "all" ] || [ "${{ inputs.target }}" = "backend" ]; then
              echo "🔄 [Dispatch] Triggering Backend CI workflow (backend-ci.yml)..."
              gh workflow run backend-ci.yml --ref main || echo "⚠️ [Dispatch] Failed to trigger Backend CI workflow."
            fi
          else
            echo "ℹ️ [Git] No package changes detected after audit fix."
          fi